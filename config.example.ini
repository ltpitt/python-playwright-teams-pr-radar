# PR Radar — configuration template
# =============================================================================
# Copy this file to "config.ini" in the same folder, then replace the
# placeholder values below with your own:
#
#     cp config.example.ini config.ini
#
# config.ini is git-ignored, so your company repo names and Teams channel URLs
# are never committed. Keep THIS file (config.example.ini) generic — no real
# tenant IDs, group IDs, channel IDs, or internal repo names.
#
# Tip: run `python3 pr_radar.py --check` after editing to validate everything.
# =============================================================================

[repos]
# The GitHub repositories to scan for ready-for-review PRs, as "owner/repo".
# List one per line (indented under "list ="), or comma-separate them on one
# line. These are the only repos PR Radar looks at.
list =
    your-org/your-first-repo
    your-org/your-second-repo

[teams]
# Deep link to the Teams channel PR Radar posts into.
# How to get it: in Teams, open the channel → "..." (More options) →
# "Get link to channel" → Copy. Paste the whole URL on one line below.
# It looks like:
#   https://teams.microsoft.com/v2/?tenantId=<TENANT-ID>#/l/channel/19:<CHANNEL-ID>@thread.tacv2/<Channel%20Name>?groupId=<GROUP-ID>&tenantId=<TENANT-ID>
#
# IMPORTANT: keep the trailing "&launchAgent=join_launcher_web". It makes Teams
# open the channel directly in the browser; without it the web app redirects to
# the "open in desktop app / download" page and the headless run never reaches
# the channel. If your copied link lacks it, append it manually (as shown).
channel_url = https://teams.microsoft.com/v2/?tenantId=YOUR-TENANT-ID#/l/channel/19:YOUR-CHANNEL-ID@thread.tacv2/Your%20Channel?groupId=YOUR-GROUP-ID&tenantId=YOUR-TENANT-ID&launchAgent=join_launcher_web

# Optional: a second channel link, kept for future use (PR Radar does NOT post
# here yet). Leave it blank if you don't have one.
pr_channel_url =
